<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoloAI — Document & Poster Upload</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF9F6;
      --card-bg: #FFFFFF;
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --text: #0F172A;
      --muted: #64748B;
      --border: #E2E8F0;
      --green: #059669;
      --green-light: #D1FAE5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .upload-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
      text-align: center;
    }
    .logo-badge {
      background: linear-gradient(135deg, #4F46E5, #6366F1);
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.15s ease;
      background: #FFFFFF;
      color: var(--text);
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn:hover {
      background: #F8FAFC;
    }
    input[type="file"] {
      display: none;
    }
    .success-box {
      display: none;
      background: var(--green-light);
      border: 1px solid #A7F3D0;
      color: var(--green);
      padding: 24px 16px;
      border-radius: 16px;
      margin-top: 12px;
    }
    .success-box h2 {
      font-size: 18px;
      margin-bottom: 6px;
    }
    .success-box p {
      color: #065F46;
      font-size: 13.5px;
      margin-bottom: 0;
    }
    .spinner {
      display: none;
      margin: 16px auto;
      width: 32px;
      height: 32px;
      border: 3px solid #E2E8F0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="upload-card">
    <div class="logo-badge">बो</div>
    <h1>BoloAI Verification</h1>
    <p>Send what you want me to check.<br>Upload a photo or document from your phone.</p>

    <div id="action-buttons" class="btn-group">
      <!-- Camera Button -->
      <label class="btn btn-primary">
        <span>📸</span> Take Photo
        <input type="file" accept="image/*" capture="environment" onchange="handleFileSelect(event)">
      </label>

      <!-- Choose from Gallery -->
      <label class="btn">
        <span>🖼️</span> Choose Photo from Gallery
        <input type="file" accept="image/jpeg,image/png,image/webp" onchange="handleFileSelect(event)">
      </label>

      <!-- PDF / Document -->
      <label class="btn">
        <span>📄</span> Upload Document / PDF
        <input type="file" accept="application/pdf,image/*" onchange="handleFileSelect(event)">
      </label>
    </div>

    <div id="spinner" class="spinner"></div>

    <div id="success-box" class="success-box">
      <h2>Received ✓</h2>
      <p>Your document has been sent to BoloAI.<br><strong>You can return to your call now.</strong></p>
    </div>
  </div>

  <script>
    const token = window.location.pathname.split('/').pop();

    async function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 10 * 1024 * 1024) {
        alert("File size exceeds 10MB limit.");
        return;
      }

      document.getElementById('action-buttons').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch(`/u/${token}`, {
          method: 'POST',
          body: formData,
        });
        const data = await res.json();
        document.getElementById('spinner').style.display = 'none';
        if (data.ok) {
          document.getElementById('success-box').style.display = 'block';
        } else {
          alert('Upload failed: ' + (data.error || 'Server error'));
          document.getElementById('action-buttons').style.display = 'flex';
        }
      } catch (err) {
        document.getElementById('spinner').style.display = 'none';
        alert('Network error while uploading');
        document.getElementById('action-buttons').style.display = 'flex';
      }
    }
  </script>
</body>
</html>
